<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill de français</title>
<style>
  :root {
    --bg: #faf8f4; --card: #ffffff; --ink: #2b2a27; --muted: #8a857c;
    --accent: #29527a; --good: #2e7d4f; --bad: #b3402e; --line: #e6e1d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 2.5rem 1rem;
  }
  main { width: 100%; max-width: 620px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2rem; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
  #session-line { color: var(--muted); font-size: 0.85rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.6rem 1.5rem; margin-bottom: 1rem;
  }
  #sentence { font-size: 1.25rem; line-height: 1.7; }
  #sentence .blank {
    display: inline-block; min-width: 5.5ch; border-bottom: 2px solid var(--accent);
    text-align: center; color: var(--accent); font-weight: 600;
  }
  #sentence .inf { color: var(--muted); font-style: italic; }
  #answer-row { display: flex; gap: 0.6rem; margin-top: 1.1rem; }
  #answer {
    flex: 1; font: inherit; font-size: 1.1rem; padding: 0.45rem 0.7rem;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
  }
  #answer:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    font: inherit; font-size: 0.95rem; padding: 0.45rem 1rem; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  #feedback { margin-top: 1.1rem; display: none; }
  #verdict { font-weight: 650; }
  #verdict.good { color: var(--good); }
  #verdict.bad { color: var(--bad); }
  #why { margin-top: 0.35rem; }
  #meta { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; }
  #stats-panel { display: none; }
  #stats-panel table { border-collapse: collapse; width: 100%; margin-top: 0.6rem; }
  #stats-panel td, #stats-panel th { text-align: left; padding: 0.25rem 0.5rem 0.25rem 0; font-size: 0.95rem; }
  #stats-panel th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
  #weakest { margin-top: 0.8rem; }
  footer { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
  footer select { font: inherit; padding: 0.3rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  #ai-status { flex-basis: 100%; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.8rem; }
  #mode-toggle { display: flex; gap: 0.4rem; }
  #mode-toggle button { padding: 0.25rem 0.8rem; font-size: 0.85rem; }
  #mode-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #gender-row { display: none; gap: 0.6rem; margin-top: 1.1rem; }
  #gender-row button { flex: 1; font-size: 1.05rem; padding: 0.55rem 0; }
  #sentence .genre-word { font-weight: 650; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Drill de français</h1>
    <div id="mode-toggle">
      <button id="mode-tense" class="active">Temps</button>
      <button id="mode-genre">Genre</button>
    </div>
    <span id="session-line">Session : 0 réponses</span>
  </header>

  <div class="card" id="drill-card">
    <div id="sentence">Chargement…</div>
    <div id="answer-row">
      <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Forme conjuguée…" disabled>
      <button class="primary" id="submit-btn" disabled>Valider</button>
    </div>
    <div id="gender-row">
      <button id="btn-m">masculin <small>(M)</small></button>
      <button id="btn-f">féminin <small>(F)</small></button>
    </div>
    <div id="feedback">
      <div id="verdict"></div>
      <div id="why"></div>
      <div id="meta"></div>
    </div>
    <div class="hint">Entrée pour valider, Entrée encore pour l'item suivant. Mode genre : touches M / F.</div>
  </div>

  <div class="card" id="stats-panel">
    <strong>Bilan de session</strong>
    <table><thead><tr><th>Paire</th><th>Score</th></tr></thead><tbody id="stats-body"></tbody></table>
    <div id="weakest"></div>
  </div>

  <footer>
    <button id="end-btn">Fin de session</button>
    <select id="ai-pair">
      <option value="imp-cond">imparfait vs conditionnel</option>
      <option value="pc-imp">passé composé vs imparfait</option>
      <option value="cond-fut">conditionnel vs futur simple</option>
      <option value="subj">subjonctif triggers</option>
    </select>
    <button id="ai-btn">+ 5 items IA</button>
    <span id="ai-status"></span>
  </footer>
</main>

<script>
"use strict";

const PAIRS = {
  "imp-cond": "imparfait vs conditionnel",
  "pc-imp": "passé composé vs imparfait",
  "cond-fut": "conditionnel vs futur simple",
  "subj": "subjonctif triggers",
};
const STAT_LABELS = { ...PAIRS, genre: "masculin vs féminin" };
const RECENT_CAP = 10;
const GENRE_RECENT_CAP = 25;

let items = [];
let nouns = [];
let progress = { attempts: [] };
let session = [];
let mode = "tense";     // "tense" | "genre"
let current = null;
let answered = false;
let recent = [];        // ids served recently, to avoid immediate repeats
let recentGenre = [];
let priorityQueue = []; // freshly AI-generated items, served next

const $ = (id) => document.getElementById(id);

// --- normalization: accent-lenient comparison -------------------------------
function norm(s) {
  return s.toLowerCase().trim().replace(/\s+/g, " ").replace(/[’‘]/g, "'");
}
function deaccent(s) {
  return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/œ/g, "oe").replace(/æ/g, "ae");
}
function grade(input, item) {
  const candidates = [item.answer, ...(item.alt || [])];
  if (candidates.some((c) => norm(c) === norm(input))) return "exact";
  if (candidates.some((c) => deaccent(c) === deaccent(input))) return "accent";
  return "wrong";
}

// --- adaptive selection ------------------------------------------------------
function pairStats(attempts) {
  const s = {};
  for (const p in STAT_LABELS) s[p] = { n: 0, wrong: 0 };
  for (const a of attempts) {
    if (!s[a.pair]) continue;
    s[a.pair].n++;
    if (!a.correct) s[a.pair].wrong++;
  }
  return s;
}

function pickItem() {
  if (priorityQueue.length) return priorityQueue.shift();
  // Smoothed error rate per pair over recent history; weakest pairs get picked more.
  const stats = pairStats(progress.attempts.slice(-200));
  const weights = {};
  let total = 0;
  for (const p in PAIRS) {
    if (!items.some((i) => i.pair === p)) continue;
    weights[p] = (stats[p].wrong + 1) / (stats[p].n + 2);
    total += weights[p];
  }
  let r = Math.random() * total;
  let pair = Object.keys(weights)[0];
  for (const p in weights) {
    r -= weights[p];
    if (r <= 0) { pair = p; break; }
  }
  let pool = items.filter((i) => i.pair === pair && !recent.includes(i.id));
  if (!pool.length) pool = items.filter((i) => i.pair === pair);
  return pool[Math.floor(Math.random() * pool.length)];
}

// --- core loop ---------------------------------------------------------------
function renderItem(item) {
  current = item;
  answered = false;
  if (item.id) {
    recent.push(item.id);
    if (recent.length > RECENT_CAP) recent.shift();
  }
  const blank = '<span class="blank">?</span> <span class="inf">(' + item.infinitive + ")</span>";
  $("sentence").innerHTML = item.sentence.replace("___", blank);
  $("answer").value = "";
  $("answer").disabled = false;
  $("submit-btn").disabled = false;
  $("submit-btn").textContent = "Valider";
  $("feedback").style.display = "none";
  $("answer").focus();
}

function saveProgress() {
  fetch("/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(progress),
  }).catch(() => {});
}

function submit() {
  const input = $("answer").value;
  if (!norm(input)) return;
  answered = true;
  const result = grade(input, current);
  const correct = result !== "wrong";

  const attempt = { id: current.id || "ai", pair: current.pair, correct, ts: Date.now() };
  progress.attempts.push(attempt);
  session.push(attempt);
  saveProgress();

  const v = $("verdict");
  if (result === "exact") {
    v.className = "good";
    v.textContent = "✓ Correct — " + current.answer + " (" + current.tense + ")";
  } else if (result === "accent") {
    v.className = "good";
    v.textContent = "✓ Bon temps — attention aux accents : " + current.answer + " (" + current.tense + ")";
  } else {
    v.className = "bad";
    v.textContent = "✗ " + (input.trim() || "—") + " → " + current.answer + " (" + current.tense + ")";
  }
  $("why").textContent = current.why;
  $("meta").textContent = "Paire : " + (PAIRS[current.pair] || current.pair);
  $("feedback").style.display = "block";
  $("answer").disabled = true;
  $("submit-btn").textContent = "Suivant";

  updateSessionLine();
}

function updateSessionLine() {
  const n = session.length;
  const ok = session.filter((a) => a.correct).length;
  $("session-line").textContent =
    "Session : " + n + " réponse" + (n > 1 ? "s" : "") + " · " + Math.round((100 * ok) / n) + " %";
}

function next() {
  $("stats-panel").style.display = "none";
  if (mode === "genre") renderGenderItem(pickGenderItem());
  else renderItem(pickItem());
}

// --- gender mode ---------------------------------------------------------------
function nounId(n) {
  return "g:" + n.w + ":" + n.g;
}

function pickGenderItem() {
  // last outcome per word: retry misses most, then unseen words, then review
  const last = {};
  for (const a of progress.attempts) {
    if (a.pair === "genre") last[a.id] = a.correct;
  }
  const pools = { missed: [], unseen: [], seen: [] };
  for (const n of nouns) {
    const id = nounId(n);
    if (recentGenre.includes(id)) continue;
    if (!(id in last)) pools.unseen.push(n);
    else if (!last[id]) pools.missed.push(n);
    else pools.seen.push(n);
  }
  const buckets = [["missed", 0.5], ["unseen", 0.35], ["seen", 0.15]]
    .filter(([k]) => pools[k].length);
  const total = buckets.reduce((sum, [, w]) => sum + w, 0);
  let r = Math.random() * total;
  let pool = pools[buckets[0][0]];
  for (const [k, w] of buckets) {
    r -= w;
    if (r <= 0) { pool = pools[k]; break; }
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function article(n) {
  const art = n.a || (/^[aàâeéèêëiîïoôuûœ]/i.test(n.w) ? "l'" : n.g === "m" ? "le" : "la");
  return art.endsWith("'") ? art + n.w : art + " " + n.w;
}

function renderGenderItem(n) {
  current = n;
  answered = false;
  recentGenre.push(nounId(n));
  if (recentGenre.length > GENRE_RECENT_CAP) recentGenre.shift();
  $("sentence").innerHTML =
    '<span class="blank">le / la ?</span> <span class="genre-word"></span> <span class="inf"></span>';
  $("sentence").querySelector(".genre-word").textContent = n.w;
  $("sentence").querySelector(".inf").textContent = "(" + n.e + ")";
  $("btn-m").disabled = false;
  $("btn-f").disabled = false;
  $("feedback").style.display = "none";
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function answerGender(g) {
  if (answered || mode !== "genre" || !current) return;
  answered = true;
  const correct = g === current.g;
  const attempt = { id: nounId(current), pair: "genre", correct, ts: Date.now() };
  progress.attempts.push(attempt);
  session.push(attempt);
  saveProgress();

  const label = current.g === "m" ? "masculin" : "féminin";
  const v = $("verdict");
  v.className = correct ? "good" : "bad";
  v.textContent = (correct ? "✓ " : "✗ ") + article(current) + " — " + label + " (" + current.e + ")";
  $("why").textContent = current.n || "No reliable rule here — memorize it.";
  $("meta").textContent = "Mode : genre";
  $("feedback").style.display = "block";
  $("btn-m").disabled = true;
  $("btn-f").disabled = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  updateSessionLine();
}

function setMode(m) {
  mode = m;
  $("mode-tense").classList.toggle("active", m === "tense");
  $("mode-genre").classList.toggle("active", m === "genre");
  $("answer-row").style.display = m === "tense" ? "flex" : "none";
  $("gender-row").style.display = m === "genre" ? "flex" : "none";
  $("ai-pair").style.display = $("ai-btn").style.display = m === "tense" ? "" : "none";
  next();
}

// --- session stats -----------------------------------------------------------
function showStats() {
  const body = $("stats-body");
  body.innerHTML = "";
  const s = pairStats(session);
  for (const p in STAT_LABELS) {
    if (!s[p].n) continue;
    const ok = s[p].n - s[p].wrong;
    const row = document.createElement("tr");
    row.innerHTML = "<td>" + STAT_LABELS[p] + "</td><td>" + ok + "/" + s[p].n +
      " (" + Math.round((100 * ok) / s[p].n) + " %)</td>";
    body.appendChild(row);
  }
  if (!session.length) body.innerHTML = "<tr><td colspan=2>Aucune réponse cette session.</td></tr>";

  const all = pairStats(progress.attempts);
  let weakest = null;
  for (const p in STAT_LABELS) {
    if (!all[p].n) continue;
    const err = (all[p].wrong + 1) / (all[p].n + 2);
    if (!weakest || err > weakest.err) weakest = { p, err, ...all[p] };
  }
  $("weakest").textContent = weakest
    ? "Paire la plus faible (historique) : " + STAT_LABELS[weakest.p] + " — " +
      (weakest.n - weakest.wrong) + "/" + weakest.n + " au total."
    : "Pas encore d'historique.";
  $("stats-panel").style.display = "block";
}

// --- AI generation (optional) --------------------------------------------------
async function generateAI() {
  const btn = $("ai-btn");
  const status = $("ai-status");
  btn.disabled = true;
  status.textContent = "Génération…";
  try {
    const resp = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pair: $("ai-pair").value }),
    });
    const data = await resp.json();
    if (resp.status === 503) {
      status.textContent = "Pas de ANTHROPIC_API_KEY — banque statique seulement.";
    } else if (!resp.ok) {
      status.textContent = "Erreur de génération : " + (data.error || resp.status);
    } else {
      data.items.forEach((it, i) => { it.id = "ai-" + Date.now() + "-" + i; });
      priorityQueue.push(...data.items);
      status.textContent = data.items.length + " items IA ajoutés — servis en priorité.";
    }
  } catch (e) {
    status.textContent = "Erreur réseau : " + e.message;
  }
  btn.disabled = false;
}

// --- wiring --------------------------------------------------------------------
$("submit-btn").addEventListener("click", () => (answered ? next() : submit()));
$("answer").addEventListener("keydown", (e) => {
  if (e.key === "Enter") answered ? next() : submit();
});
document.addEventListener("keydown", (e) => {
  const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
  if (mode === "genre" && !answered) {
    const k = e.key.toLowerCase();
    if (k === "m") { answerGender("m"); return; }
    if (k === "f") { answerGender("f"); return; }
  }
  // buttons handle their own Enter via click, so skip them to avoid double-advance
  if (e.key === "Enter" && answered && document.activeElement !== $("answer") && !onButton) next();
});
$("mode-tense").addEventListener("click", () => setMode("tense"));
$("mode-genre").addEventListener("click", () => setMode("genre"));
$("btn-m").addEventListener("click", () => (answered ? next() : answerGender("m")));
$("btn-f").addEventListener("click", () => (answered ? next() : answerGender("f")));
$("end-btn").addEventListener("click", showStats);
$("ai-btn").addEventListener("click", generateAI);

(async function init() {
  let loadedItems, loadedNouns;
  try {
    [loadedItems, loadedNouns] = await Promise.all([
      fetch("items.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("nouns.json").then((r) => (r.ok ? r.json() : [])).catch(() => []),
    ]);
  } catch (e) {
    $("sentence").textContent =
      "Impossible de charger items.json — cette page doit être servie par l'app elle-même. " +
      "Lancez « python3 server.py » dans french-tense-drill et ouvrez l'URL affichée " +
      "(par défaut http://localhost:8642).";
    return;
  }
  items = loadedItems;
  nouns = loadedNouns;
  if (!nouns.length) $("mode-genre").disabled = true;
  try {
    const r = await fetch("progress.json");
    if (r.ok) progress = await r.json();
    if (!Array.isArray(progress.attempts)) progress = { attempts: [] };
  } catch (e) { /* first run: no progress file yet */ }
  next();
})();
</script>
</body>
</html>
